; ===========================================================================
;  Karst - scripts
; ===========================================================================
;  Drop this file next to gamemd.exe (the folder that also holds Karst.dll).
;
;  Scripts let you configure Karst without editing rule INIs and without
;  writing C++. They are plain JSON (with // comments allowed), so a page can
;  generate them for you later.
;
;  Scripts take precedence over the equivalent INI settings: when both describe
;  the same building, the script wins. That keeps a conflict diagnosable by
;  reading the script alone.
; ===========================================================================

[Scripts]

; Master switch. no = load the list but do nothing.
Enabled=yes

; Where the *.jsonc files live, relative to the game directory.
Directory=Karst\scripts

; Re-read the scripts when one is saved while the game is running.
;
; OFF by default. A script is a build input here, and the decision taken for
; this project is that editing one and restarting the game is fine. Enabling it
; costs one timestamp scan per frame and nothing else.
;
; Note: this only reloads the JSON appearance rules. C# scripts are a separate
; system (the script host) which watches its own folder on its own.
HotReload=no

; ---------------------------------------------------------------------------
;  Notes
;
;  * Every *.jsonc in that folder is read. A file may hold one script or a
;    {"scripts": [ ... ]} list.
;  * A script with a problem is reported with its file and line and is skipped -
;    it never half-applies.
;  * With HotReload=yes, saving a script re-reads the whole set, and adding or
;    deleting a file is noticed too. What a change affects, and when, is
;    explained in docs\karst使用.md: a look change needs the type's ART to be
;    parsed again, i.e. a newly built building or the next match.
;  * See scripts\examples\appearance.jsonc for the shape of a script.
; ---------------------------------------------------------------------------
