; ===========================================================================
;  Karst - configuration
; ===========================================================================
;  Drop this file next to gamemd.exe (the folder that also holds Karst.dll).
;  Every key is optional: delete the file and Karst runs with the defaults
;  shown below.
;
;  Keys are case-insensitive. Lines starting with ';' or '#' are comments.
; ===========================================================================

[Karst]

; Master switch. no = load the DLL but do nothing.
Enabled=yes

; How much to write to the debug output (DebugView / Visual Studio).
; off | error | warn | info | debug
LogLevel=info

; Also append to karst.log next to gamemd.exe. Useful when the game crashes
; before you can attach a debugger; leave off for normal play.
DebugLog=no

; Reserved for an on-screen "[Karst] ..." banner once a match starts.
; The skeleton deliberately does not post one yet: touching the engine message
; list requires a real "engine is ready" signal, not just a readable pointer.
; See the warning section in README.md before enabling this.
ShowActiveMessage=yes

; ---------------------------------------------------------------------------
; Feature switches go in their own sections, below.
; ---------------------------------------------------------------------------

[Features]
