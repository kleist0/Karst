; ===========================================================================
;  Karst - INI hot reload: which rule INI files may be reread while playing
; ===========================================================================
;  Drop this file next to gamemd.exe (the folder that also holds Karst.dll).
;
;  While the game is running, saving one of the files listed under Files= makes
;  Karst reread the rule INIs and refeed the engine's type objects, so the edit
;  takes effect without leaving the match.
;
;  THIS LIST IS THE WHOLE BOUNDARY OF THE FEATURE. A file that is not listed
;  here is not watched and never reread - that includes RA2MD.INI, karst.ini
;  and every other INI in the folder.
;
;  Only .ini files are accepted; the suffix is not configurable. An entry that
;  points at something else, at a missing file, or at a path outside the game
;  directory is reported in the log and ignored - the rest of the list still
;  works. There is no half-applied state.
; ===========================================================================

[IniHotReload]

; Master switch for this feature. no = load the list but do nothing.
Enabled=yes

; The files to watch, comma separated, resolved against the game directory.
; Sub folders are allowed (e.g. Rules\MyRules.ini).
;
; They are reread IN THIS ORDER, and reading an INI merges its sections, so a
; later file overrides an earlier one. The current map is read after all of
; them, which is the order the engine itself uses.
Files=rulesmd.ini,artmd.ini,aimd.ini

; Which kinds of type may be refed when a section changes.
;
; This is the safety dial. Refeeding a type runs that type's own LoadFromINI -
; engine and extension code that was only ever written to run while the game was
; loading. The verified default is buildings; everything in "all" is expected to
; work but has not been measured here.
;
; HOW THE VALUE IS READ   (this was previously undocumented - see below)
;
; The list ADDS to the default; it does not replace it:
;
;     * a named group or kind switches that kind ON and leaves the rest alone
;     * buildings are therefore ALWAYS on unless you clear them first
;     * only "all", "none" and "default" reset the set, and they act left to
;       right, so anything listed after them adds to what they left behind
;
; So "Types=weapons" means buildings + weapons, NOT weapons alone. The upside is
; that the verified-safe baseline cannot be dropped by accident, which is the
; direction a safety dial should fail in.
;
; To get an EXACT set, start from "none":
;
;     Types=weapons            buildings + weapon/warhead/bullet
;     Types=none,weapons       weapon/warhead/bullet only
;     Types=none,units         unit/infantry/aircraft only
;     Types=default,units      buildings + units      <- staged rollout
;
; Values:
;   default    buildings only (the verified default); also what an absent,
;              empty or unrecognised value falls back to
;   all        every kind, EXCEPT TerrainType (which is refused outright:
;              the reference implementation measured a crash there)
;   none       clears the set (the files are still parsed and reported)
;   buildings,units,weapons          named groups
;   WeaponType,WarheadType           named kinds (comma separated)
;
; Group names: buildings, units (unit/infantry/aircraft),
;              weapons (weapon/warhead/bullet)
; Kind names:  BuildingType, UnitType, InfantryType, AircraftType, WeaponType,
;              WarheadType, BulletType, AnimType, VoxelAnimType, ParticleType,
;              ParticleSystemType, OverlayType, SmudgeType, IsotileType,
;              SuperWeaponType, HouseType, Side
;
; Every reload that refed something logs which kinds it refed, as
; "IniHotReload[refed] <Kind> <count>" followed by a kind count. That makes a
; staged rollout checkable from karst.log instead of a guess.
;;
; MEASURED (2026-10-12, in-game, this machine)
;
;   Types=default                     398 types refed   265 ms   stable
;   Types=default,units               553 types refed   469 ms   stable
;   Types=default,units,weapons       914 types refed   422 ms   stable
;   Types=all                        1792 types refed   484 ms   stable
;
; Time barely grows with the number of kinds: the cost is dominated by reading
; the ~1.2 MB of INI text and rebuilding the section snapshots (~140 ms floor),
; not by the per-type refeed. Widening the whitelist is therefore cheap.
;
; The value below is "all except IsotileType". Measured reason: IsotileType has
; 1064 members and NONE of them refed successfully (they have no INI section -
; they are engine-built), so with Types=all they contributed 1064 of the 1187
; reported failures and bought nothing. Leaving them out keeps the failure list
; readable without giving up anything that works.
;
; "failed" is mostly benign: a type with no section of its own (commented out,
; engine-defined, or only referenced by name) makes LoadFromINI answer false.
; Confirmed for CASYDN01/CATIME/CALA02/CALOND02, YDUM, APACHE, VISC_LRG/VISC_SML.

Types=BuildingType,UnitType,InfantryType,AircraftType,WeaponType,WarheadType,BulletType,AnimType,VoxelAnimType,ParticleType,ParticleSystemType,OverlayType,SmudgeType,SuperWeaponType,HouseType,Side

; ---------------------------------------------------------------------------
; Limits worth knowing (see docs\karst使用.md for the full list)
;
;   * Only fields that are read from the TYPE object change. A value an already
;     built object copied at construction time keeps its old value.
;   * Global scalar sections such as [General] are not reread in this version.
;   * TerrainType is never reread: the reference implementation measured a
;     crash there.
;   * Changes apply to the current process only. Nothing is written back, and a
;     new match rereads the files from disk anyway.
; ---------------------------------------------------------------------------
